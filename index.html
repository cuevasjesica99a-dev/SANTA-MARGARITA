<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA RELEVAMIENTO SANTA MARGARITA - OFICIAL</title>
  <style>
    :root { 
      --verde-santa-margarita: #004d33; 
      --verde-claro: #f1f8e9;
      --rojo-alerta: #d32f2f; 
      --dorado-santa-margarita: #c5a059; 
      --azul-proximos: #1976d2;
      --gris-fondo: #f0f2f5; 
      --blanco: #ffffff;
    }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--gris-fondo); padding: 10px; margin: 0; text-transform: uppercase; }
    .container { background: var(--blanco); padding: 25px; border-radius: 15px; max-width: 650px; margin: auto; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--verde-santa-margarita); }
    .header-santa { text-align: center; margin-bottom: 25px; }
    .header-santa h2 { font-family: 'Georgia', serif; color: var(--verde-santa-margarita); font-size: 32px; margin: 0; font-weight: bold; }
    .header-santa h4 { color: #555; margin: 0; font-size: 12px; letter-spacing: 3px; font-weight: bold; }
    label { font-weight: bold; display: block; margin-top: 20px; color: var(--verde-santa-margarita); font-size: 13px; }
    input, select { width: 100%; padding: 14px; margin-top: 6px; border: 2px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; text-transform: uppercase; font-size: 14px; }
    
    /* ============================================
       AUTOCOMPLETE PERSONALIZADO
       ============================================ */
    .autocomplete-wrapper { position: relative; }
    .autocomplete-wrapper input { width: 100%; box-sizing: border-box; }
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 2px solid var(--verde-santa-margarita);
      border-top: none;
      border-radius: 0 0 10px 10px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,77,51,0.15);
      display: none;
    }
    .autocomplete-dropdown.visible { display: block; }
    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.highlighted {
      background: var(--verde-claro);
      color: var(--verde-santa-margarita);
    }
    .autocomplete-item .match-highlight {
      background: #c5a05944;
      color: var(--verde-santa-margarita);
      font-weight: 900;
      border-radius: 2px;
      padding: 0 1px;
    }
    .autocomplete-no-results {
      padding: 12px 16px;
      font-size: 12px;
      color: #999;
      font-style: italic;
      text-transform: none;
    }

    .p-prod, .p-vendedor { border: 2px solid var(--verde-santa-margarita) !important; background-color: var(--verde-claro); font-weight: bold; }
    .input-error { border: 3px solid var(--rojo-alerta) !important; background-color: #ffebee !important; }
    .msg-error { color: var(--rojo-alerta); font-size: 10px; font-weight: bold; margin-top: 5px; display: none; }

    .selector-secciones { display: flex; gap: 8px; margin: 25px 0; flex-wrap: wrap; }
    .btn-tab { flex: 1; min-width: 100px; padding: 12px 5px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #666; transition: 0.3s; font-size: 10px; }
    .btn-tab.active-venc { background: var(--dorado-santa-margarita); color: white; }
    .btn-tab.active-prox { background: var(--azul-proximos); color: white; }
    .btn-tab.active-aver { background: var(--rojo-alerta); color: white; }
    
    .pregunta-contenedor { background: var(--verde-claro); padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #c8e6c9; }
    .botones-decision { display: flex; gap: 15px; max-width: 250px; margin: auto; margin-top: 15px; }
    .btn-sn { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; }
    .active-si { background: var(--verde-santa-margarita) !important; color: white; border-color: var(--verde-santa-margarita); }
    .active-no { background: var(--rojo-alerta) !important; color: white; border-color: var(--rojo-alerta); }
    .seccion-productos { display: none; margin-top: 15px; }
    .producto-row { background: white; padding: 18px; margin-bottom: 15px; border-left: 6px solid var(--verde-santa-margarita); border-radius: 8px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .btn-add { background: var(--verde-santa-margarita); color: white; width: 100%; padding: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-remove { background: #ff5252; color: white; font-size: 11px; padding: 8px 12px; border: none; border-radius: 5px; margin-top: 12px; cursor: pointer; float: right; font-weight: bold; }
    .btn-enviar { width: 100%; background: var(--verde-santa-margarita); color: white; margin-top: 40px; font-size: 18px; padding: 22px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }

    .checklist-container { background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-top: 8px; }
    .check-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; font-size: 12px; }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; }
  </style>
</head>

<div class="container">
  <div class="header-santa">
    <h2>Santa Margarita</h2>
    <h4>CONTROL DE CALIDAD</h4>
  </div>

  <form id="formulario">
    <label>NOMBRE DEL RELEVADOR (BUSCAR)</label>
    <!-- Autocomplete personalizado reemplaza al input + datalist -->
    <div class="autocomplete-wrapper">
      <input 
        type="text" 
        id="vendedor" 
        class="p-vendedor" 
        placeholder="ESCRIBA PARA BUSCAR..." 
        required 
        autocomplete="off"
        oninput="onVendedorInput(this)"
        onkeydown="onVendedorKeydown(event)"
        onfocus="onVendedorFocus()"
      >
      <div class="autocomplete-dropdown" id="vendedor-dropdown"></div>
    </div>

    <label>PUNTO DE VENTA</label>
    <select id="pdv" required>
      <option value="">-- PRIMERO SELECCIONE RELEVADOR --</option>
    </select>

    <div class="selector-secciones">
        <button type="button" id="tab-venc" class="btn-tab active-venc" onclick="cambiarTab('venc')">📅 VENCIDOS</button>
        <button type="button" id="tab-prox" class="btn-tab" onclick="cambiarTab('prox')">⏳ PROX. A VENCER</button>
        <button type="button" id="tab-aver" class="btn-tab" onclick="cambiarTab('aver')">⚠️ AVERIADOS</button>
    </div>

    <div id="panel-vencidos">
        <div class="pregunta-contenedor">
            <span style="font-size: 13px; font-weight: bold; color: var(--verde-santa-margarita);">¿HAY PRODUCTOS VENCIDOS?</span>
            <div class="botones-decision">
              <button type="button" id="venc-si" class="btn-sn" onclick="decidirCarga('venc', true)">SÍ</button>
              <button type="button" id="venc-no" class="btn-sn" onclick="decidirCarga('venc', false)">NO</button>
            </div>
        </div>
        <div id="seccion-vencidos" class="seccion-productos">
            <div id="cont-vencidos"></div>
            <button type="button" class="btn-add" onclick="agregarFila('venc')">+ AÑADIR PRODUCTO</button>
        </div>
    </div>

    <div id="panel-proximos" style="display:none;">
        <div class="pregunta-contenedor">
            <span style="font-size: 13px; font-weight: bold; color: var(--verde-santa-margarita);">¿HAY PRODUCTOS PRÓXIMOS A VENCER?</span>
            <div class="botones-decision">
              <button type="button" id="prox-si" class="btn-sn" onclick="decidirCarga('prox', true)">SÍ</button>
              <button type="button" id="prox-no" class="btn-sn" onclick="decidirCarga('prox', false)">NO</button>
            </div>
        </div>
        <div id="seccion-proximos" class="seccion-productos">
            <div id="cont-proximos"></div>
            <button type="button" class="btn-add" onclick="agregarFila('prox')">+ AÑADIR PRODUCTO</button>
        </div>
    </div>

    <div id="panel-averiados" style="display:none;">
        <div class="pregunta-contenedor">
            <span style="font-size: 13px; font-weight: bold; color: var(--verde-santa-margarita);">¿HAY PRODUCTOS AVERIADOS?</span>
            <div class="botones-decision">
              <button type="button" id="aver-si" class="btn-sn" onclick="decidirCarga('aver', true)">SÍ</button>
              <button type="button" id="aver-no" class="btn-sn" onclick="decidirCarga('aver', false)">NO</button>
            </div>
        </div>
        <div id="seccion-averiados" class="seccion-productos">
            <div id="cont-averiados"></div>
            <button type="button" class="btn-add" onclick="agregarFila('aver')">+ AÑADIR AVERÍA</button>
        </div>
    </div>

    <button type="submit" class="btn-enviar" id="btnEnvio">ENVIAR REPORTE</button>
  </form>
</div>

const todosLosRelevadores = Object.keys(datosPDV);

// ============================================================
// AUTOCOMPLETE PERSONALIZADO - Búsqueda por cualquier parte
// ============================================================
let highlightedIndex = -1;

function normalizarTexto(texto) {
  // Normalizar tildes y pasar a minúsculas para comparar
  return texto.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function resaltarCoincidencia(nombre, query) {
  // Resalta la parte del nombre que coincide con el query (case-insensitive, sin tildes)
  const nombreNorm = normalizarTexto(nombre);
  const queryNorm = normalizarTexto(query);
  const idx = nombreNorm.indexOf(queryNorm);
  if (idx === -1) return nombre;
  const antes = nombre.substring(0, idx);
  const coincide = nombre.substring(idx, idx + query.length);
  const despues = nombre.substring(idx + query.length);
  return `${antes}<span class="match-highlight">${coincide}</span>${despues}`;
}

function mostrarDropdown(resultados, query) {
  const dropdown = document.getElementById("vendedor-dropdown");
  highlightedIndex = -1;

  if (resultados.length === 0) {
    dropdown.innerHTML = `<div class="autocomplete-no-results">No se encontraron resultados para "${query}"</div>`;
  } else {
    dropdown.innerHTML = resultados.map((nombre, i) =>
      `<div class="autocomplete-item" data-valor="${nombre}" onmousedown="seleccionarRelevador('${nombre.replace(/'/g,"\\'")}')">
        ${resaltarCoincidencia(nombre, query)}
      </div>`
    ).join("");
  }

  dropdown.classList.add("visible");
}

function cerrarDropdown() {
  document.getElementById("vendedor-dropdown").classList.remove("visible");
  highlightedIndex = -1;
}

function onVendedorInput(input) {
  const query = input.value.trim();
  input.value = input.value.toUpperCase();

  if (query.length < 2) {
    cerrarDropdown();
    actualizarPDV();
    return;
  }

  const queryNorm = normalizarTexto(query);
  const resultados = todosLosRelevadores.filter(nombre =>
    normalizarTexto(nombre).includes(queryNorm)
  );

  mostrarDropdown(resultados, query);
  actualizarPDV();
}

function onVendedorFocus() {
  const query = document.getElementById("vendedor").value.trim();
  if (query.length >= 2) {
    const queryNorm = normalizarTexto(query);
    const resultados = todosLosRelevadores.filter(nombre =>
      normalizarTexto(nombre).includes(queryNorm)
    );
    mostrarDropdown(resultados, query);
  }
}

function onVendedorKeydown(event) {
  const dropdown = document.getElementById("vendedor-dropdown");
  const items = dropdown.querySelectorAll(".autocomplete-item");

  if (event.key === "ArrowDown") {
    event.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
    actualizarHighlight(items);
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    actualizarHighlight(items);
  } else if (event.key === "Enter") {
    event.preventDefault();
    if (highlightedIndex >= 0 && items[highlightedIndex]) {
      seleccionarRelevador(items[highlightedIndex].dataset.valor);
    }
  } else if (event.key === "Escape") {
    cerrarDropdown();
  }
}

function actualizarHighlight(items) {
  items.forEach((item, i) => {
    item.classList.toggle("highlighted", i === highlightedIndex);
  });
  if (items[highlightedIndex]) {
    items[highlightedIndex].scrollIntoView({ block: "nearest" });
  }
}

function seleccionarRelevador(nombre) {
  document.getElementById("vendedor").value = nombre;
  cerrarDropdown();
  actualizarPDV();
}

// Cerrar dropdown al hacer click fuera
document.addEventListener("click", function(e) {
  if (!e.target.closest(".autocomplete-wrapper")) {
    document.querySelectorAll(".autocomplete-dropdown").forEach(d => d.classList.remove("visible"));
    highlightedIndex = -1;
  }
});

function actualizarPDV() {
  const relevadorSeleccionado = document.getElementById("vendedor").value;
  const selectPDV = document.getElementById("pdv");
  
  if (datosPDV[relevadorSeleccionado]) {
    selectPDV.innerHTML = '<option value="">-- SELECCIONE PDV --</option>';
    datosPDV[relevadorSeleccionado].forEach(pdv => {
      let option = document.createElement("option");
      option.value = pdv;
      option.textContent = pdv;
      selectPDV.appendChild(option);
    });
  } else {
    selectPDV.innerHTML = '<option value="">-- RELEVADOR NO VÁLIDO --</option>';
  }
}

function validarProducto(input) {
  const row = input.parentElement;
  const errorMsg = row.querySelector(".msg-error");
  if (input.value === "" || PRODUCTOS_VALIDOS.includes(input.value)) {
    input.classList.remove('input-error');
    if(errorMsg) errorMsg.style.display = "none";
  } else {
    input.classList.add('input-error');
    if(errorMsg) errorMsg.style.display = "block";
  }
}

// ============================================================
// AUTOCOMPLETE DE PRODUCTOS - Búsqueda por cualquier parte
// ============================================================
let prodHighlightIndex = {};

function onProductoInput(input, uid) {
  input.value = input.value.toUpperCase();
  const query = input.value.trim();
  if (query.length < 2) {
    cerrarDropdownProducto(uid);
    validarProducto(input);
    return;
  }
  const queryNorm = normalizarTexto(query);
  const resultados = PRODUCTOS_VALIDOS.filter(p => normalizarTexto(p).includes(queryNorm)).slice(0, 30);
  mostrarDropdownProducto(uid, resultados, query, input);
  validarProducto(input);
}

function onProductoFocus(input, uid) {
  const query = input.value.trim();
  if (query.length >= 2) {
    const queryNorm = normalizarTexto(query);
    const resultados = PRODUCTOS_VALIDOS.filter(p => normalizarTexto(p).includes(queryNorm)).slice(0, 30);
    mostrarDropdownProducto(uid, resultados, query, input);
  }
}

function mostrarDropdownProducto(uid, resultados, query, input) {
  const dropdown = document.getElementById('prod-drop-' + uid);
  prodHighlightIndex[uid] = -1;
  if (resultados.length === 0) {
    dropdown.innerHTML = '<div class="autocomplete-no-results">Sin resultados para "' + query + '"</div>';
  } else {
    dropdown.innerHTML = resultados.map(p =>
      '<div class="autocomplete-item" data-valor="' + p.replace(/"/g,'&quot;') + '" onmousedown="seleccionarProducto(this, \'' + uid + '\')">' + resaltarCoincidencia(p, query) + '</div>'
    ).join('');
  }
  dropdown.classList.add('visible');
}

function cerrarDropdownProducto(uid) {
  const dropdown = document.getElementById('prod-drop-' + uid);
  if (dropdown) dropdown.classList.remove('visible');
  prodHighlightIndex[uid] = -1;
}

function seleccionarProducto(item, uid) {
  const valor = item.dataset.valor;
  const dropdown = document.getElementById('prod-drop-' + uid);
  const wrapper = dropdown.closest('.autocomplete-wrapper');
  const input = wrapper.querySelector('.p-prod');
  input.value = valor;
  cerrarDropdownProducto(uid);
  validarProducto(input);
}

function onProductoKeydown(event, uid) {
  const dropdown = document.getElementById('prod-drop-' + uid);
  const items = dropdown.querySelectorAll('.autocomplete-item');
  if (prodHighlightIndex[uid] === undefined) prodHighlightIndex[uid] = -1;

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    prodHighlightIndex[uid] = Math.min(prodHighlightIndex[uid] + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('highlighted', i === prodHighlightIndex[uid]));
    if (items[prodHighlightIndex[uid]]) items[prodHighlightIndex[uid]].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    prodHighlightIndex[uid] = Math.max(prodHighlightIndex[uid] - 1, 0);
    items.forEach((it, i) => it.classList.toggle('highlighted', i === prodHighlightIndex[uid]));
    if (items[prodHighlightIndex[uid]]) items[prodHighlightIndex[uid]].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter') {
    event.preventDefault();
    if (prodHighlightIndex[uid] >= 0 && items[prodHighlightIndex[uid]]) {
      seleccionarProducto(items[prodHighlightIndex[uid]], uid);
    }
  } else if (event.key === 'Escape') {
    cerrarDropdownProducto(uid);
  }
}

document.getElementById("formulario").onsubmit = function(e) {
  e.preventDefault();
  
  if (respuestas.venc === null || respuestas.prox === null || respuestas.aver === null) { 
    alert("DEBE COMPLETAR TODOS LOS APARTADOS (VENCIDOS, PRÓXIMOS Y AVERIADOS)."); 
    return; 
  }

  if (!datosPDV[document.getElementById("vendedor").value]) {
    alert("POR FAVOR SELECCIONE UN RELEVADOR VÁLIDO DE LA LISTA.");
    return;
  }

  let inputsProductos = document.querySelectorAll(".p-prod");
  let hayErrores = false;
  inputsProductos.forEach(input => {
    if (!PRODUCTOS_VALIDOS.includes(input.value)) {
      input.classList.add('input-error');
      const errorMsg = input.parentElement.querySelector(".msg-error");
      if(errorMsg) errorMsg.style.display = "block";
      hayErrores = true;
    }
  });

  if (hayErrores) {
    alert("❌ NO SE PUEDE ENVIAR: HAY PRODUCTOS NO VÁLIDOS EN LA LISTA.");
    return;
  }

  const btn = document.getElementById("btnEnvio");
  btn.disabled = true; btn.innerText = "ENVIANDO...";

  const payload = {
    relevador: document.getElementById("vendedor").value,
    pdv: document.getElementById("pdv").value,
    vencidos: [],
    proximos: [],
    averiados: []
  };

  document.querySelectorAll("#cont-vencidos .producto-row").forEach(r => {
    payload.vencidos.push({ 
      producto: r.querySelector(".p-prod").value, 
      extra: r.querySelector(".p-extra").value, 
      cant: r.querySelector(".p-cant").value 
    });
  });

  document.querySelectorAll("#cont-proximos .producto-row").forEach(r => {
    payload.proximos.push({ 
      producto: r.querySelector(".p-prod").value, 
      extra: r.querySelector(".p-extra").value, 
      cant: r.querySelector(".p-cant").value 
    });
  });

  document.querySelectorAll("#cont-averiados .producto-row").forEach(r => {
    let seleccionados = [];
    r.querySelectorAll(".checklist-container input[type='checkbox']:checked").forEach(check => {
      if(check.value === "OTROS") {
        let espec = r.querySelector(".input-otros-especificar").value;
        seleccionados.push("OTROS: " + (espec ? espec : "SIN ESPECIFICAR"));
      } else {
        seleccionados.push(check.value);
      }
    });

    if(seleccionados.length === 0) {
      alert("POR FAVOR SELECCIONE AL MENOS UN TIPO DE AVERÍA.");
      btn.disabled = false; btn.innerText = "ENVIAR REPORTE";
      throw "Validación Checklist fallida";
    }

    payload.averiados.push({ 
      producto: r.querySelector(".p-prod").value, 
      observacion: seleccionados.join(" | "), 
      cant: r.querySelector(".p-cant").value 
    });
  });

  fetch("https://script.google.com/macros/s/AKfycbyXQa5Ph0twAV7vKNdf6hxnIHIeNwKLvnAsUE0Z4XkqD806KMqWxL00RRJZeZC5IXxKjg/exec", {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(payload)
  }).then(() => {

  });
};
